<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebView Permission Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


.card {

    width:90%;
    max-width:420px;

    background:white;

    border-radius:20px;

    padding:35px 30px;

    text-align:center;

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);

}


.icon {

    font-size:64px;

}


h1 {

    color:#333;

    margin:15px 0;

}


p {

    color:#666;

    line-height:1.5;

}



button {

    width:100%;

    margin-top:18px;

    padding:16px;

    border:none;

    border-radius:12px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}


.location {

    background:#4f46e5;

}


.camera {

    background:#16a34a;

}



button:active {

    transform:scale(.98);

}



.result {

    margin-top:25px;

    padding:15px;

    min-height:100px;

    background:#f5f5f5;

    border-radius:12px;

    text-align:left;

    font-size:14px;

    word-break:break-word;

}


video {

    margin-top:15px;

    width:100%;

    border-radius:12px;

    display:none;

}


</style>

</head>


<body>


<div class="card">


<div class="icon">
🔐
</div>


<h1>
WebView Permission Test
</h1>


<p>
Test Geolocation and Camera permissions
inside Android WebView.
</p>



<button class="location"
onclick="requestLocation()">

📍 Allow Location

</button>



<button class="camera"
onclick="requestCamera()">

📷 Allow Camera

</button>



<video id="video" autoplay></video>


<div class="result" id="result">

Waiting for permission...

</div>



</div>



<script>


const result =
document.getElementById("result");



function requestLocation(){


result.innerHTML =
"Requesting location...";


if(!navigator.geolocation){

result.innerHTML =
"Geolocation unavailable";

return;

}



navigator.geolocation.getCurrentPosition(

(position)=>{


result.innerHTML =

`
<b>Location Granted</b><br><br>

Latitude:
${position.coords.latitude}<br>

Longitude:
${position.coords.longitude}<br>

Accuracy:
${position.coords.accuracy} meters
`;

},


(error)=>{


result.innerHTML =

`
<b>Location Error</b><br>
${error.message}
`;

},


{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0

}

);


}





async function requestCamera(){


result.innerHTML =
"Requesting camera...";


try{


const stream =

await navigator.mediaDevices.getUserMedia({

video:true,

audio:false

});



const video =
document.getElementById("video");


video.srcObject = stream;

video.style.display="block";



result.innerHTML =

`
<b>Camera Granted</b><br><br>
Video stream started.
`;



}

catch(e){


result.innerHTML =

`
<b>Camera Error</b><br>
${e.message}
`;

}


}



</script>


</body>
</html>
