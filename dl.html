<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Intent Sender</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            color: #1f2937;
        }

        .container {
            width: min(520px, calc(100% - 32px));
            background: #fff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            margin: 0 0 24px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.99);
        }

        .hint {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.6;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Android Intent Sender</h1>

    <p class="description">
        输入目标 URL，点击按钮后通过 Android
        <code>intent://</code> URI 发送 Intent。
    </p>

    <label for="url">URL</label>

    <input
        id="url"
        type="url"
        value="https://github.com/"
        placeholder="https://example.com/"
    >

    <button onclick="sendIntent()">
        发送 Intent
    </button>

    <div class="hint">
        Extra:<br>
        processedTargetClsName =
        com.hihonor.library.information.js.HnShareWebActivity<br>
        key_web_title = GitHub<br>
        key_web_url = 当前输入的 URL
    </div>
</div>

<script>
function sendIntent() {
    const url = document.getElementById("url").value.trim();

    if (!url) {
        alert("请输入 URL");
        return;
    }

    try {
        new URL(url);
    } catch (e) {
        alert("请输入有效的 URL，例如 https://github.com/");
        return;
    }

    /*
     * Android Intent URI
     *
     * S.xxx = String Extra
     */
    const intent =
        "intent://com.hihonor.health/uniformJump" +
        "?routerPath=/device/device_detail" +
        "&isNeedLogin=false" +
        "#Intent;" +
        "scheme=hihonor;" +
        "action=android.intent.action.VIEW;" +
        "package=com.hihonor.health;" +
        "S.processedTargetClsName=" +
            encodeURIComponent(
                "com.hihonor.library.information.js.HnShareWebActivity"
            ) +
        ";" +
        "S.key_web_title=" +
            encodeURIComponent("GitHub") +
        ";" +
        "S.key_web_url=" +
            encodeURIComponent(url) +
        ";" +
        "end";

    console.log("Intent URI:", intent);

    window.location.href = intent;
}
</script>

</body>
</html>
