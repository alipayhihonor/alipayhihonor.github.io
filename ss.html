    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatValue(value) {
      if (value === undefined) return "undefined";
      if (value === null) return "null";
      if (typeof value === "string") return value;

      try {
        return JSON.stringify(value, null, 2);
      } catch (e) {
        return String(value);
      }
    }

    function formatArg(arg) {
      if (arg === undefined) return "undefined";
      if (arg === null) return "null";
      if (typeof arg === "string") return JSON.stringify(arg);
      if (typeof arg === "number" || typeof arg === "boolean") return String(arg);

      try {
        return JSON.stringify(arg);
      } catch (e) {
        return String(arg);
      }
    }

    function formatArgs(args = []) {
      return args.map(formatArg).join(", ");
    }

    /**
     * 构造调用器
     * @param {string} objName window 上的对象名
     * @param {string} method 方法名
     * @param {Array} args 参数数组
     */
    function buildInvoker(objName, method, args = []) {
      return () => {
        const target = window[objName];
        if (!target) {
          throw new Error(`对象不存在: ${objName}`);
        }

        const fn = target[method];
        if (typeof fn !== "function") {
          throw new Error(`方法不存在: ${objName}.${method}`);
        }

        return fn.apply(target, args);
      };
    }

    /**
     * 更方便的配置方法
     * 用法:
     * makeApi("SebHandlerInterface", "setTitle", ["测试标题"])
     */
    function makeApi(objName, method, args = []) {
      return {
        name: `${objName}.${method}(${formatArgs(args)})`,
        invoke: buildInvoker(objName, method, args)
      };
    }

    const resultContainer = document.getElementById("resultContainer");

    function createCard(item) {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="method">${escapeHtml(item.name)}</div>
        <div class="status pending">执行中</div>

        <div class="label">结果</div>
        <pre class="result">等待执行...</pre>

        <div class="label" style="margin-top:12px;">错误信息</div>
        <pre class="errorText">无</pre>
      `;

      resultContainer.appendChild(card);
      return card;
    }

    async function runOne(item) {
      const card = createCard(item);
      const statusEl = card.querySelector(".status");
      const resultEl = card.querySelector(".result");
      const errorEl = card.querySelector(".errorText");

      try {
        // 兼容同步方法 / Promise 方法
        const result = await Promise.resolve(item.invoke());

        card.classList.remove("error");
        card.classList.add("success");

        statusEl.className = "status success";
        statusEl.textContent = "成功";

        resultEl.textContent = formatValue(result);
        errorEl.textContent = "无";
      } catch (err) {
        card.classList.remove("success");
        card.classList.add("error");

        statusEl.className = "status error";
        statusEl.textContent = "失败";

        resultEl.textContent = "无结果";
        errorEl.textContent = err && err.stack ? err.stack : String(err);
      }
    }

    async function runAll() {
      clearResults();

      for (const item of apiList) {
        try {
          await runOne(item);
        } catch (e) {
          // 双保险：确保单个任务异常不会影响后续执行
          console.error("runOne failed:", e);
        }
      }
    }

    function clearResults() {
      resultContainer.innerHTML = "";
    }

    // 页面加载后自动执行，可按需注释掉
    window.onload = () => {
      runAll();
    };
