<script>
    var pkgName = "com.bytxmt.banyuetan";

    var downloadData = {
        downloadUrl: "https://example.com/app.apk",
        pkgName: pkgName,

        // 以下坐标不是必需，但 startDownLoad 会尝试读取
        downX: 100,
        downY: 100,
        upX: 100,
        upY: 100
    };

    window.dscb1 = function (result) {
        console.log("queryState callback: " + JSON.stringify(result));
        delete window.dscb1;
    };

    window.dscb2 = function (result) {
        console.log("startDownLoad callback: " + JSON.stringify(result));
        delete window.dscb2;
    };

    // 查询当前应用下载状态
    _dsbridge.call(
        "download.queryState",
        JSON.stringify({
            data: downloadData,
            _dscbstub: "dscb1"
        })
    );

    setTimeout(function () {
        // 触发下载
        _dsbridge.call(
            "download.startDownLoad",
            JSON.stringify({
                data: downloadData,
                _dscbstub: "dscb2"
            })
        );
    }, 1000);
</script>
