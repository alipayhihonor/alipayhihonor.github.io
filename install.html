<script>
    function callNative(method, data, callbackName) {
        window[callbackName] = function (result) {
            alert(method + " callback: " + JSON.stringify(result));
        };

        _dsbridge.call(
            method,
            JSON.stringify({
                data: data,
                _dscbstub: callbackName
            })
        );
    }

    var data = {
        downloadUrl: "https://f-droid.org/F-Droid.apk",
        pkgName: "com.example.test",
        downX: 100,
        downY: 100,
        upX: 100,
        upY: 100
    };

    callNative("download.queryState", data, "dscb_query");

    setTimeout(function () {
        callNative("download.startDownLoad", data, "dscb_download");
    }, 1000);
</script>
