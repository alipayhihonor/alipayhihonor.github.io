<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>触发语音指令 - 安装微信</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1f2937, #111827);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 18px;
    color: #111827;
    margin: 0 0 8px;
  }
  p {
    font-size: 13px;
    color: #6b7280;
    margin: 0 0 24px;
    line-height: 1.6;
    word-break: break-all;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 14px 0;
    background: #07c160;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active {
    opacity: 0.85;
  }
  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: #9ca3af;
  }
</style>
</head>
<body>

<div class="card">
  <h1>语音助手指令</h1>
  <p>点击下方按钮，通过 Deeplink 触发指令："安装微信"</p>
  <a class="btn" href="yoyo://com.hihonor.magicvoice/skill?query=%E5%AE%89%E8%A3%85%E5%BE%AE%E4%BF%A1&isSend=1&sysAgentId=Normal&inputType=1" id="deeplinkBtn">
    立即触发
  </a>
  <div class="hint">若未自动跳转，请确认设备已安装对应应用</div>
</div>

<script>
  // 页面加载后自动尝试触发一次（可选，如不需要自动触发可删除此段）
  window.addEventListener('load', function () {
    // 自动触发已注释，避免非预期跳转，如需自动触发取消下面注释
    // window.location.href = document.getElementById('deeplinkBtn').href;
  });

  // 手动点击时的日志
  document.getElementById('deeplinkBtn').addEventListener('click', function () {
    console.log('Deeplink triggered:', this.href);
  });
</script>

</body>
</html>
