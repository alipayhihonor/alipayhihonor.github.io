<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSBridge 手机端调试</title>
    <style>
        body { background: #000; color: #ccc; font-family: monospace; margin: 0; padding: 10px; font-size: 14px; }
        #debug-console { word-break: break-all; }
        .log-entry { border-bottom: 1px solid #333; padding: 10px 5px; margin-bottom: 5px; }
        
        /* 不同类型的显示样式 */
        .type-info { border-left: 4px solid #2196F3; background: #111; }
        .type-error { border-left: 4px solid #f44336; background: #2a1010; color: #ffbaba; }
        .type-callback { border-left: 4px solid #4CAF50; background: #102a10; color: #baffba; }
        
        .label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 12px; opacity: 0.7; }
        pre { white-space: pre-wrap; margin: 0; font-size: 13px; }
        .time { float: right; color: #666; font-size: 11px; }
    </style>
</head>
<body>

    <div style="padding: 10px; color: #fff; border-bottom: 1px solid #444; margin-bottom: 10px;">
        <strong>DEBUG TERMINAL</strong>
    </div>
    
    <div id="debug-console"></div>

<script>
    // --- 核心显示引擎：直接操作 DOM ---
    function printToScreen(title, content, type = 'info') {
        const consoleEl = document.getElementById('debug-console');
        const entry = document.createElement('div');
        entry.className = `log-entry type-${type}`;
        
        const time = new Date().toLocaleTimeString();
        let text = typeof content === 'object' ? JSON.stringify(content, null, 2) : content;
        
        entry.innerHTML = `
            <span class="time">${time}</span>
            <span class="label">[${title}]</span>
            <pre>${text}</pre>
        `;
        
        // 新日志放在最上面，方便手机查看
        consoleEl.insertBefore(entry, consoleEl.firstChild);
    }

    // --- 1. 捕获全局 JavaScript 错误 (如变量未定义) ---
    window.onerror = function(msg, url, line, col, error) {
        printToScreen("脚本运行错误", {
            message: msg,
            line: line,
            stack: error ? error.stack : '无堆栈信息'
        }, 'error');
        return false; 
    };

    // --- 2. 定义回调函数 ---
    window.MyCallback = function(callbackId, eventType, data, d, e) {
        try {
            printToScreen("Native 回调触发", {
                id: callbackId,
                type: eventType,
                data: data,
                extraD: d,
                extraE: e
            }, 'callback');
        } catch (err) {
            printToScreen("回调内部逻辑报错", err.message, 'error');
        }
    };

    // --- 3. 执行 Native 调用 (分块执行，互不干扰) ---

    // 准备数据
    let test_Json = "";
    try {
        test_Json = JSON.stringify({
            "packageName": "jp.pokemon.pokemonunite",
            "trackingParameter": "test",
            "externalJson": "test",
            "showToast": "you are hacked",
            "isRefresh": true
        });
        printToScreen("数据准备", "JSON 构建成功", 'info');
    } catch (e) {
        printToScreen("数据准备失败", e.message, 'error');
    }

    // 调用 1: getAppDeviceInfo
    try {
        printToScreen("发起调用", "getAppDeviceInfo...", 'info');
        window.Native.nativeMethod(
            "com.hihonor.hm.h5.container.js.method.DeviceMethods", 
            "getAppDeviceInfo", 
            test_Json, 
            "3", 
            "MyCallback"
        );
    } catch (e) {
        // 如果 window.Native 不存在，这里会直接在屏幕显示红色错误
        printToScreen("调用 1 失败", "错误详情: " + e.toString(), 'error');
    }

    // 调用 2: getUserInfo
    try {
        printToScreen("发起调用", "getUserInfo...", 'info');
        window.Native.nativeMethod("", "getUserInfo", "{}", "1", "MyCallback");
    } catch (e) {
        printToScreen("调用 2 失败", "错误详情: " + e.toString(), 'error');
    }

    // 延迟调用示例
    setTimeout(function() {
        try {
            // 这里可以放你之前注释掉的测试代码
            // printToScreen("延迟任务", "开始执行...", 'info');
        } catch (e) {
            printToScreen("延迟任务报错", e.message, 'error');
        }
    }, 500);

</script>
</body>
</html>
